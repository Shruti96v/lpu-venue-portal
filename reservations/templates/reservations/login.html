{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | LPU Venue Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
        }
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,.35);
            padding: 40px;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-logo-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #1d4ed8, #6366f1);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px;
            font-size: 26px; color: #fff;
        }
        .login-title {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
            margin: 0 0 4px;
        }
        .login-subtitle {
            font-size: 12px;
            color: #64748b;
        }
        .login-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #fef9c3;
            color: #854d0e;
            border: 1px solid #fde68a;
            border-radius: 999px;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 8px;
        }
        .login-form-group { margin-bottom: 16px; }
        .login-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #374151;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 6px;
        }
        .login-input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            color: #0f172a;
            background: #f8fafc;
            transition: all .2s;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
        }
        .login-input:focus {
            outline: none;
            border-color: #1d4ed8;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(29,78,216,.12);
        }
        .login-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #1d4ed8, #4f46e5);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            font-family: 'Inter', sans-serif;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .login-btn:hover { opacity: .9; transform: translateY(-1px); }
        .login-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 12px;
            color: #991b1b;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #94a3b8;
        }
        .login-footer a { color: #1d4ed8; font-weight: 600; }
        .cred-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 20px;
        }
        .cred-box-title {
            font-size: 11px;
            font-weight: 700;
            color: #15803d;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: .4px;
        }
        .cred-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #374151;
            padding: 2px 0;
        }
        .cred-val { font-weight: 700; font-family: monospace; color: #1d4ed8; }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">

        <div class="login-logo">
            <div class="login-logo-icon">
                <i class="fa-solid fa-building-columns"></i>
            </div>
            <div class="login-title">LPU Venue Portal</div>
            <div class="login-subtitle">Lovely Professional University, Phagwara</div>
            <div class="login-badge">
                <i class="fa-solid fa-shield-halved"></i> Admin Access Only
            </div>
        </div>

        <!-- Error messages -->
        {% if form.errors %}
        <div class="login-error">
            <i class="fa-solid fa-circle-xmark"></i>
            Incorrect username or password. Please try again.
        </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="login-form-group">
                <label class="login-label"><i class="fa-solid fa-user"></i> Username</label>
                <input type="text"
                       name="username"
                       class="login-input"
                       placeholder="Enter username"
                       autocomplete="username"
                       required>
            </div>

            <div class="login-form-group">
                <label class="login-label"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password"
                       name="password"
                       class="login-input"
                       placeholder="Enter password"
                       autocomplete="current-password"
                       required>
            </div>

            <button type="submit" class="login-btn">
                <i class="fa-solid fa-right-to-bracket"></i>
                Sign In to Admin Panel
            </button>
        </form>

        <div class="login-footer">
            <a href="{% url 'dashboard' %}">
                <i class="fa-solid fa-arrow-left"></i> Back to Public Portal
            </a>
        </div>
    </div>
</div>
</body>
</html>
