version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: smart-finance-db
    restart: always
    ports:
      - "127.0.0.1:27018:27017" # Securely bind to port 27018 on host to avoid conflict with local MongoDB, accessible by other docker containers on internal network on 27017
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-finance-backend
    restart: always
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - MONGO_URI=mongodb://mongodb:27017/smart-finance-manager
      - JWT_SECRET=super_secret_session_key_change_me_in_production
      - JWT_EXPIRE=30d
      - NODE_ENV=production
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: smart-finance-frontend
    restart: always
    ports:
      - "8080:80" # Maps local port 8080 to container Nginx port 80
    environment:
      - BACKEND_URL=http://backend:5005
    depends_on:
      - backend

volumes:
  mongo-data:
