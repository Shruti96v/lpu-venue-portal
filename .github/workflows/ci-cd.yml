name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # --- Backend Testing ---
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Run Backend Unit Tests (Jest)
        run: |
          cd backend
          npm run test:unit

      - name: Seed Test Database & Run Integration Tests
        env:
          MONGO_URI: mongodb://localhost:27017/smart-finance-manager
          PORT: 5005
          JWT_SECRET: test_secret_key_123
          NODE_ENV: test
        run: |
          cd backend
          node seed.js
          npm run test:integration

      # --- Frontend Testing & Linting ---
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Frontend Linting (oxlint)
        run: |
          cd frontend
          npm run lint

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    # Build and push only on push events to main (avoid duplicate registry pushes on PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/smart-finance-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/smart-finance-backend:${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/smart-finance-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/smart-finance-frontend:${{ github.sha }}

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Backend Deployment
        run: |
          if [ -n "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" ]; then
            echo "Triggering Render backend redeployment..."
            curl -f -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
          else
            echo "::warning::RENDER_BACKEND_DEPLOY_HOOK secret is not set. Skipping deployment."
          fi

      - name: Trigger Render Frontend Deployment
        run: |
          if [ -n "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" ]; then
            echo "Triggering Render frontend redeployment..."
            curl -f -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
          else
            echo "::warning::RENDER_FRONTEND_DEPLOY_HOOK secret is not set. Skipping deployment."
          fi
